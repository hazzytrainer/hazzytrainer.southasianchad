<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Book Your Call | Coach Hazzy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
<style>
  :root {
    --saffron: #FFD600;
    --saffron-light: #FFE666;
    --deep: #0D0B08;
    --charcoal: #1A1713;
    --warm-dark: #221E18;
    --cream: #F5EFE6;
    --muted: #9A8E7E;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--deep);
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    line-height: 1.7;
    overflow-x: hidden;
  }

  /* ── NOISE TEXTURE OVERLAY ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/filter%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
    opacity: 0.4;
  }

  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 88px 24px 24px;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(232,129,10,0.18) 0%, transparent 70%);
  }

  .hero-eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--saffron);
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp 0.8s 0.2s forwards;
  }

  h1 {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    line-height: 1.05;
    font-size: clamp(38px, 7vw, 72px);
    max-width: 820px;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp 0.8s 0.35s forwards;
  }

  h1 em { font-style: normal; color: var(--saffron); }

  .hero-sub {
    font-size: 18px;
    max-width: 580px;
    color: rgba(245,239,230,0.85);
    opacity: 0;
    animation: fadeUp 0.8s 0.5s forwards;
  }

  .calendly-wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 8px 16px 64px;
    opacity: 0;
    animation: fadeUp 0.8s 0.65s forwards;
  }

  .calendly-inline-widget {
    min-width: 320px;
    height: 700px;
  }

  .reassure {
    text-align: center;
    font-size: 14px;
    color: var(--muted);
    max-width: 560px;
    margin: 0 auto;
    padding: 0 24px 64px;
  }

  footer {
    border-top: 1px solid rgba(245,239,230,0.07);
    padding: 32px 24px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    .hero { padding-top: 72px; }
    .hero-sub { font-size: 16px; }
    .calendly-inline-widget { height: 760px; }
  }
</style>
</head>
<body>

<section class="hero">
  <p class="hero-eyebrow">You're Qualified</p>
  <h1>Book Your <em>Call.</em></h1>
  <p class="hero-sub">Pick a time below. On the call, we'll review your application, tell you what's possible for you, and lay out your plan.</p>
</section>

<div class="calendly-wrap">
  <div class="calendly-inline-widget" data-url="https://calendly.com/hazzytrainer/carveyourbody"></div>
</div>

<p class="reassure">Can't find a time that works? DM "APPLIED" on Instagram and we'll sort it out.</p>

<footer>© Coach Hazzy — Carve Your Body</footer>

<script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>
<script>
  // Once the call is booked, move qualified leads to the thank-you page.
  window.addEventListener('message', function (e) {
    if (e.data && e.data.event === 'calendly.event_scheduled') {
      window.location.href = 'thank-you-quality.html';
    }
  });
</script>

</body>
</html>
